services:
  app:
    build: .

    env_file:
      - .env

    ports:
      - "8000:8000"
      
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy


  postgres:
    image: postgres:18-alpine
    restart: unless-stopped

    env_file:
      - .env

    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

    volumes:
      - postgres-data:/var/lib/postgresql

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  redis:
    image: redis:8-alpine
    restart: unless-stopped

    volumes:
      - redis-data:/data

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  worker:
    build: .

    env_file:
      - .env

    command: ["uv", "run", "--no-dev", "celery", "-A", "app.workers.tasks", "worker", "--loglevel=info", "-Q", "otp,email,maintenance,report"]

    depends_on:
      redis:
        condition: service_healthy

    healthcheck:
      test: ["CMD", "celery", "-A", "app.workers.tasks", "inspect", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  beat:
    build: .

    env_file:
      - .env

    command: ["uv", "run", "--no-dev", "celery", "-A", "app.workers.tasks", "beat", "--loglevel=info"]

    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy

    healthcheck:
      test: ["CMD", "celery", "-A", "app.workers.tasks", "inspect", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s


volumes:
  postgres-data:
  redis-data:
