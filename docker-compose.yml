services:
  app:
    build: .

    env_file:
      - .env

    depends_on:
      postgres:
        condition: service_healthy

    develop:
      watch:
        - action: sync
          path: .
          target: /app

        - action: rebuild
          path: pyproject.toml

        - action: rebuild
          path: uv.lock


  postgres:
    image: postgres:18-alpine
    restart: unless-stopped

    env_file:
      - .env

    ports:
      - "5432:5432"

    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

    volumes:
      - postgres-data:/var/lib/postgresql

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

    


volumes:
  postgres-data:
